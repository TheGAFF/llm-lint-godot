[package]
name = "godot-llm-lint"
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
description = "Godot-native role, feature, reference and duplicate enforcement"
license = "MIT"
repository = "https://github.com/TheGAFF/llm-lint-godot"
readme = "README.md"
publish = false
include = [
    "/src/**", "/policy/**", "/examples/rules/**", "/examples/quickstart/**", "/docs/**",
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/SECURITY.md", "/LICENSE",
    "/THIRD_PARTY_NOTICES.txt", "/rust-toolchain.toml", "/rustfmt.toml", "/clippy.toml",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.23", features = ["serde"] }
tree-sitter = "=0.24.6"
tree-sitter-gdscript = "=6.1.0"
sha2 = "0.10"
pulldown-cmark = "=0.13.6"
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"

[package.metadata.llm-lint]
version = 1

# Generated by cargo llm-lint; edit Cargo metadata settings.
# llm-lint managed rules: []
[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
manual_let_else = "deny"
redundant_else = "deny"
redundant_closure_for_method_calls = "deny"
needless_pass_by_value = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
return_self_not_must_use = "deny"
unused_async = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes_without_reason = "deny"
excessive_nesting = "deny"
